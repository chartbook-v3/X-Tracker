name: X-Tracker 24/7 VIP Monitor Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_send:
        description: '출력 양식 테스트 메시지 1건 발송 여부'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ inputs.test_send && 'x-tracker-test-send' || 'x-tracker-bot' }}
  cancel-in-progress: false

jobs:
  run-x-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run X-Tracker Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@chartbookx'
        run: |
          if [ "${{ inputs.test_send }}" = "true" ]; then
            python X_Tracker.py --test-send
          else
            python X_Tracker.py --max-age 90
          fi

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_history.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update sent_history.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
